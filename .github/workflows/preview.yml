name: Build D&D 5e Character Sheet Preview

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-preview:
    name: Compile Dummy Sheets & Build Preview Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fonts (Roboto, Liberation, DejaVu, Libertinus, Noto CJK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-roboto \
            fonts-liberation2 \
            fonts-dejavu-core \
            fonts-linuxlibertine \
            fonts-noto-cjk

      - name: Setup Typst
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.13.1"

      - name: Build Dummy Character Sheets & HTML Preview Page
        run: |
          chmod +x scripts/build_preview.sh
          ./scripts/build_preview.sh

      - name: Upload Preview Site & PDFs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: character-sheet-preview-site
          path: dist/
          retention-days: 30

      - name: Publish Preview Summary to Job Summary
        run: |
          cat << 'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Evermeet — Automated D&D 5e Character Sheet Preview Built ✅

          The static HTML preview gallery (`dist/index.html`), standalone card pages (`dist/<card_name>.html` & `dist/cards/<card_name>.html`), rendered high-DPI PNG pages (`dist/img/*.png`), and compiled PDFs (`dist/pdf/*.pdf`) have been generated:

          | # | Dummy Character | Class / Subclass | Pages | Source | Card HTML Page | Compiled PDF |
          | :-: | :--- | :--- | :-: | :--- | :--- | :--- |
          | **01** | **Seraphina Vale** | Paladin (Oath of Devotion 6) / Warlock (The Celestial 2) | 3 | `character.typ` | `/seraphina.html` · `/cards/seraphina.html` | `dist/pdf/seraphina_paladin_warlock.pdf` |
          | **02** | **Kaelen "Whisper" Vane** | Rogue (Arcane Trickster 7) | 3 | `examples/kaelen_rogue.typ` | `/kaelen_rogue.html` · `/cards/kaelen_rogue.html` | `dist/pdf/kaelen_rogue.pdf` |
          | **03** | **Thokk "Ironhide" Grimjaw** | Barbarian (Path of the Totem Warrior 5) | 2 | `examples/thokk_barbarian.typ` | `/thokk_barbarian.html` · `/cards/thokk_barbarian.html` | `dist/pdf/thokk_barbarian.pdf` |

          > **Download the `character-sheet-preview-site` artifact** from this workflow run and open `index.html` (or any `<card_name>.html` / `cards/<card_name>.html`) to browse the interactive preview page.
          EOF

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-pages:
    name: Deploy Preview Page to GitHub Pages
    needs: build-preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Live GitHub Pages Card URLs to Summary
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          BASE_URL="${BASE_URL%/}"
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          ## Deployed Character Card Pages 🌐

          - **Gallery Index**: ${BASE_URL}/
          - **Seraphina Vale**: ${BASE_URL}/seraphina.html (${BASE_URL}/cards/seraphina.html)
          - **Kaelen "Whisper" Vane**: ${BASE_URL}/kaelen_rogue.html (${BASE_URL}/cards/kaelen_rogue.html)
          - **Thokk "Ironhide" Grimjaw**: ${BASE_URL}/thokk_barbarian.html (${BASE_URL}/cards/thokk_barbarian.html)
          EOF
